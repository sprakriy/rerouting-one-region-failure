name: Intelligent AWS Bootstrap
on:
 workflow_dispatch:
    inputs:
      name:
        description: 'Manual trigger verification'
        required: false
        default: 'Manual trigger'
jobs:
  infrastructure-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC Handshake)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::319310747432:role/GitHubActionsServiceRole
          aws-region: us-east-1
          role-session-name: GitHubActionsSession

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -upgrade

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=main.tfplan
          echo "## 📝 Terraform Plan Result" >> $GITHUB_STEP_SUMMARY
          echo "### Account: 319310747432" >> $GITHUB_STEP_SUMMARY
          echo '```terraform' >> \$GITHUB_STEP_SUMMARY
          terraform show -no-color main.tfplan | tail -n 10 >> \$GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Guardrail - Prevent Unintended Deletions
        run: |
          if terraform show -no-color main.tfplan | grep -E "plan:.*[1-9]+ to destroy"; then
            echo "❌ ERROR: A destruction was detected in the plan. Stopping workflow for safety!"
            exit 1
          fi

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check for Existing Docker Image
        id: check-image
        run: |
          # Safe image check query using native AWS metrics
          IMAGE_EXISTS=$(aws ecr list-images --repository-name my-fargate-app --query "imageIds[?imageTag=='latest']" --output text || echo "")
          if [ -z "$IMAGE_EXISTS" ]; then
            echo "build_required=true" >> $GITHUB_OUTPUT
          else
            echo "build_required=false" >> $GITHUB_OUTPUT
          fi

      - name: Build, tag, and push image to Amazon ECR
        if: steps.check-image.outputs.build_required == 'true'
        run: |
          # Hardcoded to your exact target account registry destination path
          docker build -t ://amazonaws.com .
          docker push ://amazonaws.com

      # STEP C: Combined full-stack apply utilizing your validated plan graph
      - name: Terraform Apply (Full Stack)
        run: terraform apply -auto-approve main.tfplan

      # AUTOMATED COST INSURANCE: Fires automatically if the apply crashes mid-flight
      - name: Emergency Teardown on Failure
        if: failure()
        run: |
          echo "⚠️ Failure detected! Tearing down regional components automatically to stop cloud charges..."
          terraform destroy -auto-approve || echo "No live resources found to clean."

      # Always attempt to preserve whatever state is left for local debugging
      - name: Save State on Failure
        if: failure()
        run: |
          export PATH="$PATH:$GITHUB_PATH"
          terraform state pull > failed_state.tfstate || echo "State tracking unavailable."

      - name: Upload State Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-failed-state
          path: failed_state.tfstate
          retention-days: 5
